spring.application.name=backend_vet_in_house


spring.datasource.url=jdbc:mysql://localhost:3306/test
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql, classpath:dataRegions.sql

security.jwt.key.private=${JWT_KEY}
security.jwt.user.generator=${JWT_ISSUE}

transbank.api.key=${TBK_KEY}
transbank.commerce.code=${COMMERCE_CODE}

# CONFIGURACIÓN DE ENTORNO DE TRANSBANK (TEST o LIVE)
transbank.integration.type=${TBK_INTEGRATION_TYPE:TEST}

spring.iva.factor=${IVA_FACTOR}

# CONFIGURACIÓN DE CORREOS (GMAIL)
spring.mail.host=smtp.gmail.com
spring.mail.username=${EMAIL}
spring.mail.password=${PASS_EMAIL}
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# CONFIGURACIÓN DE SEGURIDAD DE COOKIES
cookie.secure=${SECURE_COOKIE:false}

# CONFIGURACIÓN DE CORS
cors.allowed-origin=${CORS_ORIGIN}


